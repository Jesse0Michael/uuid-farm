openapi: 3.0.3
info:
  title: UUID Farm
  description: A shelter for surrendered UUIDs.
  version: 2.0.0
  license:
    name: Unlicense
    url: https://unlicense.org/
servers:
  - url: /v1
security: []
paths:
  /:
    get:
      operationId: getFarm
      summary: Get shelter statistics
      responses:
        '200':
          description: Shelter statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Farm'
        default:
          $ref: '#/components/responses/Error'
  /uuids:
    get:
      operationId: getUUIDs
      summary: List residents in document ID order
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - in: query
          name: cursor
          description: nextCursor from the previous page; canonical UUID document ID.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A bounded page of residents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
        '400':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: adoptUUID
      summary: Adopt the first available resident in document ID order
      responses:
        '200':
          $ref: '#/components/responses/Resident'
        '404':
          $ref: '#/components/responses/Error'
        '400':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /uuids/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getUUID
      summary: Find a resident
      responses:
        '200':
          $ref: '#/components/responses/Resident'
        '400':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: surrenderUUID
      summary: Surrender a UUID, normalized to its canonical spelling
      responses:
        '201':
          description: Resident admitted
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Uuid'
        '409':
          $ref: '#/components/responses/Error'
        '400':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: updateUUID
      summary: Set or clear a resident's name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Metadata'
      responses:
        '200':
          $ref: '#/components/responses/Resident'
        '400':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
components:
  responses:
    Resident:
      description: Resident record
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Uuid'
    Error:
      description: Invalid request, missing resident, conflict, or service failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    Uuid:
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        tag:
          type: string
          readOnly: true
        surrenderDate:
          type: string
          format: date-time
        adoptionDate:
          type: string
          format: date-time
    Metadata:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          maxLength: 80
    Page:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Uuid'
        nextCursor:
          type: string
          format: uuid
    Farm:
      type: object
      required: [uuids, adopted, surrendered]
      properties:
        uuids:
          type: integer
          format: int64
        adopted:
          type: integer
          format: int64
        surrendered:
          type: integer
          format: int64
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
